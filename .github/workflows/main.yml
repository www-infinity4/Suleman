name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Start server (smoke test)
        run: |
          node server.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null" EXIT
          for i in $(seq 1 10); do
            curl --silent --fail http://localhost:3000 && break
            sleep 1
          done
          curl --fail http://localhost:3000
